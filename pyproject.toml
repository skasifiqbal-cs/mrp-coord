[project]
name = "kref"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "casadi>=3.6", "z3-solver>=4.12",
    "hydra-core>=1.3", "omegaconf>=2.3", "pettingzoo>=1.24", "gymnasium>=0.29",
    "matplotlib>=3.7", "Pillow>=10.0", "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
