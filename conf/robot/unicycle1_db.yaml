# dynobench unicycle1_v0 (dynobench/models/unicycle1_v0.yaml): the first-order counterpart
# of unicycle_db. State [x, y, θ], controls [v, ω] -- speed changes instantly.
type: unicycle
v_max: 0.5           # max_vel
v_min: -0.5          # min_vel
omega_max: 0.5       # max_angular_vel
omega_min: -0.5      # min_angular_vel
shape:
  type: box
  width: 0.5         # extent along local x (forward)  <- dynobench size[0]
  length: 0.25       # extent along local y (lateral)  <- dynobench size[1]
